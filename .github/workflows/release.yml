name: Windows Release Draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v1.9.10'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows-draft:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate version and protect published releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and Cargo version differ.' }
          $draft = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $draft -ne 'true') { throw 'Published releases are immutable. Choose a new version.' }
      - name: Verify and build
        shell: pwsh
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package verified Windows executable
        shell: pwsh
        run: ./scripts/package-windows-release.ps1 -OutputDirectory target/windows-release
      - uses: actions/upload-artifact@v4
        with:
          name: md-studio-windows-release
          path: target/windows-release/
          if-no-files-found: error
      - name: Create draft for maintainer review
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          body: |
            Windows x64 build draft. Verify the executable, checksums and deployment guide before publishing.
            This workflow does not publish macOS, Linux or mobile packages.
          files: |
            target/windows-release/MD-Preview-windows-x64.exe
            target/windows-release/MD-Preview-windows-x64.exe.sha256
            target/windows-release/MD-Studio-*-windows-x64.zip
            target/windows-release/MD-Studio-*-windows-x64.zip.sha256
            target/windows-release/MD-Studio-Deployment-*-zh.md
            target/windows-release/MD-Studio-*-licenses.zip
            target/windows-release/MD-Studio-*-licenses.zip.sha256
